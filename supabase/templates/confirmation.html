<div style="font-family: Arial, Helvetica, sans-serif; max-width: 520px; color: #2B2B2B;">
  <h2 style="color: #008E8A; margin-bottom: 12px;">Confirm your Apoyo email</h2>
  <p>Enter this code in the Apoyo app to finish creating your account. Do not share it with anyone.</p>
  <p style="font-size: 32px; letter-spacing: 8px; font-weight: 700; color: #008E8A; margin: 24px 0;">{{ .Token }}</p>

</div>
